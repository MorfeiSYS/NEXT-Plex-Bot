plex:
  base_url: "http://127.0.0.1:32400"
  token: ""
  client_identifier: "maubot-plex-zapros"
notify_users:
  - "@operator:example.com"
reply_mode: room
# Префиксы команд (без !), регистр не важен; подкоманды list/wait/accept/reject общие
command_triggers:
  - zapros
  # - kino
# Куда слать уведомления о новых запросах (не найден на Plex):
# dm — личка notify_users; room — notify_room (если задан), иначе групповая комната
# запроса (не личка с пользователем); both — комната + личка; fixed — только notify_room
# Если notify_mode не задан — как reply_mode
notify_mode: room
notify_room: ""
retention_days: 90
poll_interval_hours: 6
poll_startup_seconds: 15
poll_between_pending_seconds: 2
# Пауза между исходящими сообщениями Matrix (сек.), снижает 429 на list/модерации
matrix_send_pause_seconds: 0.55
search_limit: 10
# Макс. позиций в списке при нескольких похожих результатах !zapros
search_results_max: 5
# Смещение времени в сообщениях (часы от UTC), напр. 9 для UTC+9, 6 для UTC+6
timezone_offset_hours: 0
# Макс. длина названия в !zapros (символов, в БД и Plex); допустимо в конфиге: 10–100
title_max_length: 100
# !zapros list: макс. запросов на одного пользователя и макс. числа пользователей в ответе
list_per_user_max: 5
list_users_max: 10
# awaiting_approval старше N часов — «зависший»; напоминание операторам каждые stuck_reminder_interval_hours (0 — выкл.)
stuck_approval_hours: 24
stuck_reminder_interval_hours: 24
# Суточный лимит новых запросов «не найден на Plex» (pending) на пользователя; 0 — без лимита; повтор того же pending не считается; операторы notify_users без лимита
daily_requests_per_user_max: 0
# Суточный лимит запросов с результатом «найден на Plex» на пользователя (0 — без лимита, иначе 1–1000); операторы notify_users без лимита
daily_found_requests_per_user_max: 1000
queue_summary:
  updated_at: null
  pending_count: 0
  items: []
movie_requests: []
